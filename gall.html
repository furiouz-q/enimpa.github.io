<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GHS</title>
  </head>
  <body>
    <nav>
      <a href="./web.html">
        <div class="all">
          <div class="z">
            <img src="./z.jpg" alt="" />
          </div>
          <img src="./g.jpg" alt="" />
        </div>
      </a>
      <div class="links">
        <a href="#">History</a>
        <a href="#">SMQT</a>
        <a href="#">Info</a>
        <a href="#">Gallery</a>
        <a href="./index.html">Log Out</a>
      </div>
    </nav>
    <div class="img">
      <div class="img1">
        <img src="./2.jpg" alt="" />
        <img src="./3.jpg" alt="" />
        <img src="./4.jpg" alt="" />
      </div>
      <div class="img2">
        <img src="./5.jpg" alt="" />
        <img src="./6.jpg" alt="" />
        <img src="./7.jpg" alt="" />
      </div>
    </div>
  </body>
  <style>
    * {
      margin: 0;
      padding: 0;
    }
    body {
      background: url(./download.jpg);
      background-size: cover;
      overflow: hidden;
    }
    nav {
      width: 100vw;
      background: goldenrod;
      padding: 20px;
      box-shadow: 0 5px 100px gold;
      display: flex;
      align-items: center;
      justify-content: space-around;
      transition: filter 0.5s ease;
    }
    nav img {
      width: 100px;
      height: 100px;
      border-radius: 100%;
      box-shadow: 0 10px 25px white;
    }
    a {
      filter: blur(0);
      text-decoration: none;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Oxygen,
        Ubuntu,
        Cantarell,
        "Open Sans",
        "Helvetica Neue",
        sans-serif;
      font-size: 20px;
      color: white;
      transition: all 0.5s ease-in;
      text-shadow: 0 10px 25px white;
    }
    a:hover {
      border-bottom: 2px;
      border-radius: 20%;
      text-shadow: 0 10px 25px dimgray;
      animation: bounce 0.60s;
    }
    p {
      text-decoration: none;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Oxygen,
        Ubuntu,
        Cantarell,
        "Open Sans",
        "Helvetica Neue",
        sans-serif;
      font-size: 20px;
      color: ghostwhite;
      transition: all 0.5s ease-in;
      text-shadow: 0 10px 25px white;
    }
    .all {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: row;
      gap: 15px;
      margin-left: -100px;
    }
    .z {
      position: absolute;
      z-index: 4;
      margin-left: -100px;
    }
    .links {
      display: flex;
      gap: 20px;
    }
    .img1 {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: row;
      gap: 150px;
      margin: 15px;
    }
    .img1 img {
      width: 259px;
      height: 200px;
      border-radius: 15px;
      box-shadow: 0 10px 25px ghostwhite;
    }
    .img2 {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: row;
      gap: 150px;
      margin: 50px;
    }
    .img2 img {
      width: 259px;
      height: 200px;
      border-radius: 15px;
      box-shadow: 0 10px 25px ghostwhite;
    }
    .img {
      gap: 50px;
      margin: 10px;
    }
    @keyframes bounce {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(5px);
      }
    }
    .img2 img:hover {
      animation: bounce 0.6s;
      box-shadow: 0 10px 25px dimgray;
    }
    .img1 img:hover {
      animation: bounce 0.6s;
      box-shadow: 0 10px 25px dimgray;
    }
  </style>
</html>

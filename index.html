<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GHS Web</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="login">
      <div class="profile">
        <img src="./z.jpg" alt="Ghs" />
      </div>
      <div class="message">
        <div class="sa">
          <h2>G</h2>
        </div>
        <div class="n">
          <h2>H</h2>
        </div>
        <div class="ta">
          <h2>S</h2>
        </div>
      </div>

          <label for="username">Username</label>

          <label for="password">ID</label>
          <input type="password" placeholder="****" minlength="4" required />

        </div>

      </form>
    </div>
  </body>
</html>

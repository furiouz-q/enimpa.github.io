      <a href="./index.html">

  <style>
    * {
      margin: 0;
      padding: 0;
    }
    body {
      background: url(./download.jpg);
      background-size: cover;
      overflow: hidden;
    }
    nav {
      width: 100vw;
      background: goldenrod;
      padding: 20px;
      box-shadow: 0 5px 100px gold;
      display: flex;
      align-items: center;
      justify-content: space-around;
      transition: filter 0.5s ease;
    }
    img {
      width: 100px;
      height: 100px;
      border-radius: 100%;
      box-shadow: 0 10px 25px white;
    }
    a {
      filter: blur(0);
      text-decoration: none;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Oxygen,
        Ubuntu,
        Cantarell,
        "Open Sans",
        "Helvetica Neue",
        sans-serif;
      font-size: 20px;
      color: white;
      transition: all 0.5s ease-in;
      text-shadow: 0 10px 25px white;
    }
    a:hover {
      border-bottom: 2px;
      border-radius: 20%;
      text-shadow: 0 10px 25px dimgray;
      animation: bounce 0.60s;
    }
    p{
      text-decoration: none;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Oxygen,
        Ubuntu,
        Cantarell,
        "Open Sans",
        "Helvetica Neue",
        sans-serif;
      font-size: 20px;
      color: ghostwhite;
      transition: all 0.5s ease-in;
      text-shadow: 0 10px 25px white;
    }
    .all{
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: row;
      gap: 15px;
      margin-left: -100px;
    }
    .z{
      position: absolute;
      z-index: 4;
      margin-left: -100px;
    }
    .links {
      display: flex;
      gap: 20px;
    }
    @keyframes bounce {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(5px);
      }
    }
    footer p{
      display: flex;
      align-items: center;
      justify-content: center;
      color: black;
    }
  </style>
